// Player state
var lane=1,px=0,py=0,vy=0,jumps=0,flip=0,slideT=0,inv=0,stumbleT=0,slow=0,magnetT=0,ph=2.1;
function reset(){
  objs.forEach(function(o){scene.remove(o)});objs=[];
  dist=0;speed=14;coins=0;score=0;spawnAcc=0;gap=14;lane=1;px=0;py=0;vy=0;jumps=0;flip=0;shake=0;slideT=0;inv=0;stumbleT=0;slow=0;magnetT=0;ph=2.1;guard.visible=false;sk.visible=true;body.scale.y=1;
  sk.rotation.set(0,0,0);body.rotation.y=Math.PI/2;
  $('co').textContent='Coins 0';$('sc').textContent='0';
}
function start(){reset();state='play';card.style.display='none'}
function jump(){
  if(state==='ready'){start();return}
  if(state==='over'){if(t-overAt>.5)start();return}
  if(jumps<2){vy=jumps?8.4:9.2;jumps++;flip=jumps===1?0.001:flip}
}
function duck(){if(state!=='play')return;if(py>.05){vy=-16}else slideT=.75}
function move(d){
  if(state!=='play'){if(d===0)jump();return}
  lane=Math.max(0,Math.min(2,lane+d));
}
function crash(){
  state='over';overAt=t;shake=.35;sk.visible=true;
  if(score>best){best=score;try{localStorage.setItem('skate-best',String(best))}catch(e){}}
  $('bs').textContent='Best '+best;
  card.innerHTML='<h1>Wipeout</h1><p>Score '+score+' &nbsp;·&nbsp; Coins '+coins+'</p><p>Best '+best+'</p><div class="go">Tap to skate again</div>';
  card.style.display='block';
}

// Input
window.addEventListener('keydown',function(e){
  var k=e.code;
  if(k==='ArrowLeft'||k==='KeyA'){e.preventDefault();move(-1)}
  else if(k==='ArrowRight'||k==='KeyD'){e.preventDefault();move(1)}
  else if(k==='ArrowUp'||k==='KeyW'||k==='Space'){e.preventDefault();jump()}
  else if(k==='ArrowDown'||k==='KeyS'){e.preventDefault();duck()}
});
var tx=0,ty=0,tt=0;
window.addEventListener('pointerdown',function(e){tx=e.clientX;ty=e.clientY;tt=performance.now()});
window.addEventListener('pointerup',function(e){
  var dx=e.clientX-tx,dy=e.clientY-ty;
  if(Math.abs(dx)>28&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
  else if(dy>28)duck();
  else if(dy<-28)jump();
  else jump();
});

function update(dt){
  t+=dt;
  tex.offset.y+=(state==='play'?speed:2)*dt/8;tileTex.offset.y+=(state==='play'?speed:2)*dt/4;
  blds.forEach(function(m){m.position.z+=(state==='play'?speed:2)*dt;if(m.position.z>16)m.position.z-=168});
  lamps.forEach(function(l){l.position.z+=(state==='play'?speed:2)*dt;if(l.position.z>16)l.position.z-=160});
  var tgt=(lane-1)*LW;
  px+=(tgt-px)*Math.min(1,dt*12);
  if(state==='play'){
    speed=Math.min(14+dist/25,34)*(1-.45*slow);
    dist+=speed*dt;score=Math.floor(dist/2);$('sc').textContent=score;
    slideT=Math.max(0,slideT-dt);ph=slideT>0?.9:2.1;inv=Math.max(0,inv-dt);slow=Math.max(0,slow-dt*1.2);magnetT=Math.max(0,magnetT-dt);shake=Math.max(0,shake-dt);
    if(stumbleT>0)stumbleT-=dt;
    vy-=24*dt;py+=vy*dt;
    if(py<=0){py=0;vy=0;jumps=0;flip=0}
    if(jumps>0&&flip>0){flip+=dt*7.5;if(flip>=Math.PI*2)flip=0}
    boardG.rotation.z=flip;
    spawnAcc+=speed*dt;if(spawnAcc>gap){spawnAcc=0;gap=15+Math.random()*9;spawnRow()}
    for(var i=objs.length-1;i>=0;i--){
      var o=objs[i];o.position.z+=speed*dt;
      if(o.userData.k==='coin'){o.rotation.z+=dt*5;if(magnetT>0){var dz=-o.position.z,dx=px-o.position.x;if(Math.abs(dz)<10&&Math.abs(dx)<5){o.position.x+=dx*Math.min(1,dt*8);o.position.y+=(1+py*.5-o.position.y)*Math.min(1,dt*8)}}}
      if(o.userData.k==='mag'){o.rotation.y+=dt*4}
      if(o.position.z>6){scene.remove(o);objs.splice(i,1);continue}
      if(Math.abs(o.position.z)<(o.userData.hl||.3)+.5&&Math.abs(o.position.x-px)<.95){
        var k=o.userData.k;
        if(k==='mag'){magnetT=9;scene.remove(o);objs.splice(i,1)}
        else if(k==='coin'){if(py<2.4){coins++;$('co').textContent='Coins '+coins;scene.remove(o);objs.splice(i,1)}}
        else if(inv<=0&&py<o.userData.hi-.06&&py+ph>o.userData.lo+.06){if(o.userData.hi>=3||stumbleT>0){crash();break}stumbleT=7;inv=1.5;slow=1;shake=.25}
      }
    }
    var lean=(tgt-px);
    sk.rotation.z=-lean*.28;sk.rotation.y=lean*.2;
    armL.rotation.z=Math.sin(t*6)*.2;armR.rotation.z=-Math.sin(t*6)*.2;
    body.scale.y+=((slideT>0?.55:1)-body.scale.y)*Math.min(1,dt*18);
    sk.visible=inv<=0||Math.floor(t*18)%2===0;
    guard.visible=stumbleT>0;
    if(guard.visible){guard.position.set(px,0,2.4+Math.sin(t*10)*.15);gl.rotation.x=Math.sin(t*14)*.7;gr.rotation.x=-Math.sin(t*14)*.7}
    $('co').textContent='Coins '+coins+(magnetT>0?'  🧲 '+Math.ceil(magnetT):'');
  }else if(state==='over'){
    sk.rotation.x+=dt*6*Math.max(0,1-(t-overAt)*1.2);
    shake=Math.max(0,shake-dt);
  }
  sk.position.set(px,py,0);
  sun.position.set(px-6,10,4);sun.target.position.set(px,0,-3);
  if(state==='play'&&py<=.01){for(var e=0;e<2;e++){var s2=spI++%SN;spPos[s2*3]=px+(Math.random()-.5)*.5;spPos[s2*3+1]=.22;spPos[s2*3+2]=.5;spVel[s2*3]=(Math.random()-.5)*3;spVel[s2*3+1]=1+Math.random()*2.5;spVel[s2*3+2]=speed*.35+Math.random()*3;spLife[s2]=.45}}
  for(var sj=0;sj<SN;sj++){if(spLife[sj]>0){spLife[sj]-=dt;spVel[sj*3+1]-=9*dt;spPos[sj*3]+=spVel[sj*3]*dt;spPos[sj*3+1]+=spVel[sj*3+1]*dt;spPos[sj*3+2]+=spVel[sj*3+2]*dt;if(spLife[sj]<=0||spPos[sj*3+1]<0)spPos[sj*3+1]=-9}}
  spGeo.attributes.position.needsUpdate=true;
  for(var dk=0;dk<DN;dk++){dPos[dk*3+2]+=(state==='play'?speed:2)*dt*.8;dPos[dk*3+1]+=Math.sin(t*.7+dk)*dt*.15;if(dPos[dk*3+2]>6){dPos[dk*3+2]-=46;dPos[dk*3]=(Math.random()-.5)*14}}
  dGeo.attributes.position.needsUpdate=true;
  var cx=px*.55+(shake>0?(Math.random()-.5)*.4:0);
  var tf=(cam.aspect<.8?74:62)+(state==='play'?(speed-14)*.35:0);cam.fov+=(tf-cam.fov)*.08;cam.updateProjectionMatrix();
  cam.position.set(cx,3.4+py*.25,6.2);
  cam.lookAt(px*.35,1.1,-9);
}
var last=performance.now();
function loop(now){
  var dt=Math.min((now-last)/1000,.04);last=now;
  update(dt);if(comp)comp.render();else ren.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
